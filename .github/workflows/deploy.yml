name: Build and deploy to Cloudflare Pages
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    env:
      ARCNIX_GUIDE_DIR: .docs-source/docs/guide
    concurrency:
      group: website-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Read the user guides from Arcnix
        uses: actions/checkout@v7
        with:
          repository: arcnix-org/arcnix
          ref: main
          path: .docs-source
          sparse-checkout: docs/guide
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify both locales
        run: |
          test -s dist/index.html
          test -s dist/zh-cn/index.html
          for prefix in dist dist/zh-cn; do
            test -s "$prefix/docs/index.html"
            test -s "$prefix/docs/quick-start/index.html"
            test -s "$prefix/docs/install/index.html"
          done
          test -s dist/sitemap.xml
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN Actions secret}"
          project="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/arcnix"
          production_branch=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$project" | jq -er '.result.production_branch')
          npm exec -- wrangler pages deploy dist --project-name arcnix --branch "$production_branch" --commit-hash "$GITHUB_SHA"
